apiVersion: v1
kind: ConfigMap
metadata:
  name: xtdb-env-config
  namespace: {{ .Release.Namespace }}
data:
  KAFKA_BOOTSTRAP_SERVERS: {{ .Values.xtdbConfig.kafkaBootstrapServers | quote }}
  XTDB_LOG_TOPIC: {{ .Values.xtdbConfig.logTopic | quote }}
  JDK_JAVA_OPTIONS: {{ .Values.xtdbConfig.jdkOptions | quote }}
  XTDB_LOGGING_LEVEL: {{ .Values.xtdbConfig.loggingLevel | quote }}
  {{- with .Values.providerConfig.env }}
  {{- range $key, $val := . }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dump-upload-scripts
  namespace: {{ .Release.Namespace }}
data:
  upload-dumps.sh: |
    #!/bin/bash
    # NOTE: This sidecar must always exit 0 to avoid failing the Job
    # Errors are logged but don't affect exit code
    set -uo pipefail
    trap 'exit 0' EXIT TERM INT

    DUMP_DIR=/dumps
    PREFIX="dumps/${XTDB_NODE_ID:-unknown}/$(date +%Y-%m-%dT%H-%M-%S)"

    # Nothing is installed at runtime: a package install's memory grows with the distro's
    # repo metadata, and by Oct 2026 tdnf alone outgrew this container's memory limit.
    # Everything below is bash builtins + coreutils.

    # Azure workload identity login
    if [[ -n "${AZURE_FEDERATED_TOKEN_FILE:-}" ]]; then
      echo "Logging in with Azure workload identity..."
      az login --federated-token "$(cat "$AZURE_FEDERATED_TOKEN_FILE")" \
        --service-principal \
        -u "$AZURE_CLIENT_ID" \
        -t "$AZURE_TENANT_ID" \
        --output none
    elif [[ -n "${AZURE_CLIENT_ID:-}" ]]; then
      echo "Logging in with Azure managed identity..."
      az login --identity --username "$AZURE_CLIENT_ID" --output none
    fi

    # Returns non-zero only if every attempt fails, so the caller can try again on a later sweep
    upload_file() {
      local file=$1 attempt
      for attempt in 1 2 3; do
        echo "Uploading $file to $PREFIX/$file (attempt $attempt)..."
        if az storage blob upload \
          --account-name "$AZURE_STORAGE_ACCOUNT" \
          --container-name "${AZURE_DUMPS_CONTAINER:-$AZURE_STORAGE_CONTAINER}" \
          --name "$PREFIX/$file" \
          --file "$DUMP_DIR/$file" \
          --auth-mode login \
          --overwrite; then
          echo "Uploaded: $PREFIX/$file"
          return 0
        fi
        sleep $(( attempt * 5 ))
      done
      echo "Upload failed after $attempt attempts: $file"
      return 1
    }

    # Relies on shareProcessNamespace: true to see the main container's JVM
    java_running() {
      local c
      for c in /proc/[0-9]*/comm; do
        [[ "$(cat "$c" 2>/dev/null)" == java ]] && return 0
      done
      return 1
    }

    declare -A uploaded_size=() last_size=()

    # Uploads a dump once its size has held steady for a poll interval (or unconditionally on
    # the final sweep, once the JVM has gone). A steady size can also be a writer that's paused
    # mid-file, so a dump that grows after its upload is uploaded again (--overwrite).
    sweep_dumps() {
      local f name size
      for f in "$DUMP_DIR"/*.hprof; do
        [[ -f "$f" ]] || continue
        name=$(basename "$f")
        size=$(stat -c %s "$f")
        [[ "${uploaded_size[$name]:-}" == "$size" ]] && continue
        if [[ "${1:-}" == final || "${last_size[$name]:-}" == "$size" ]]; then
          upload_file "$name" && uploaded_size[$name]=$size
        fi
        last_size[$name]=$size
      done
    }

    # The JVM may not be up yet - or may already have come and gone, if it failed fast.
    # A dump or the main container's cleanup marker means it has run, so stop waiting.
    jvm_has_run() {
      compgen -G "$DUMP_DIR/*.hprof" >/dev/null || [[ -f "$DUMP_DIR/.cleanup-triggered" ]]
    }
    echo "Waiting for the JVM to start..."
    for _ in $(seq 300); do
      java_running || jvm_has_run && break
      sleep 1
    done

    echo "Watching $DUMP_DIR for heap dumps..."
    while java_running; do
      sweep_dumps
      sleep 5
    done

    echo "Main container exited, uploading any remaining dumps..."
    sweep_dumps final

    # Fallback: trigger cleanup workflow if main container didn't (e.g. OOM kill)
    if [ ! -f "$DUMP_DIR/.cleanup-triggered" ] && [ -n "${GITHUB_PAT:-}" ]; then
      echo "Main container did not trigger cleanup. Triggering from sidecar as fallback..."
      GITHUB_REPO="${GITHUB_REPOSITORY:-xtdb/xtdb}"
      WORKFLOW_URL="https://api.github.com/repos/${GITHUB_REPO}/actions/workflows/nightly-benchmark-cleanup.yml/dispatches"
      REF="${GIT_BRANCH:-main}"

      curl -s -X POST \
        -H "Accept: application/vnd.github+json" \
        -H "Authorization: Bearer ${GITHUB_PAT}" \
        "${WORKFLOW_URL}" \
        -d "{\"ref\":\"${REF}\"}" \
        && echo "Cleanup workflow triggered from sidecar" \
        || echo "Failed to trigger cleanup from sidecar (non-fatal)"
    elif [ -f "$DUMP_DIR/.cleanup-triggered" ]; then
      echo "Cleanup already triggered by main container."
    fi

    # Memory summary, visible in every run's logs (cgroup v2 only). OOM kills are the real signal.
    # The peak includes page cache: uploading a 3GB dump takes it to the limit while `az` itself
    # stays under ~100Mi, because cache is reclaimed rather than OOM-killed. memory.peak needs
    # kernel 5.19+, which the AKS nodes (5.15) don't have, so it's reported only where present.
    if [[ -r /sys/fs/cgroup/memory.events ]]; then
      oom_kills=$(grep '^oom_kill ' /sys/fs/cgroup/memory.events | cut -d' ' -f2)
      limit=$(cat /sys/fs/cgroup/memory.max 2>/dev/null || true)
      [[ "$limit" =~ ^[0-9]+$ ]] && limit="$(( limit / 1048576 ))Mi"
      peak=$(cat /sys/fs/cgroup/memory.peak 2>/dev/null || true)
      [[ "$peak" =~ ^[0-9]+$ ]] && peak="$(( peak / 1048576 ))Mi" || peak="n/a"
      echo "Sidecar memory - OOM kills: ${oom_kills:-unknown}, peak (incl. page cache): $peak, limit: ${limit:-unknown}"
    fi
    echo "Sidecar exiting."
