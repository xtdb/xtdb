edition = "2023";

package xtdb.mysql.proto;

import "google/protobuf/any.proto";

option java_multiple_files = true;

message MySqlSourceConfig {
    string remote = 1;
    int64 server_id = 2;
    repeated string tables = 3;

    google.protobuf.Any indexer = 4;
}

message DirectMirrorConfig {
}

message MySqlSourceToken {
    // Every upstream transaction XT has indexed, as a GTID set in MySQL's text form ("uuid:1-5:7,uuid2:1-3").
    string gtid_set = 1;
    bool snapshot_completed = 2;
}
