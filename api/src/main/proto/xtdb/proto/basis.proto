edition = "2023";

package xtdb.proto.basis;

option java_multiple_files = true;

import "google/protobuf/timestamp.proto";

message TxBasis {
    map<string, MessageIds> databases = 1;
}

message MessageIds {
    repeated int64 message_ids = 1;
}

message TimeBasis {
    map<string, SystemTimes> databases = 1;
}

message SystemTimes {
    repeated google.protobuf.Timestamp system_times = 1;
    // Parallel to system_times; empty where each partition's ingest time is its system time.
    repeated google.protobuf.Timestamp ingest_times = 2;
}
