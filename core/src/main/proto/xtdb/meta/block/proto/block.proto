edition = "2023";

package xtdb.block.proto;

import "xtdb/log/proto/log.proto";
import "xtdb/database/proto/db.proto";

option java_multiple_files = true;

// Behavioural spec: dev/doc/db.allium

message Partition {
  int32 level = 1;
  int64 recency = 2;
  bytes part = 3;
  // The `table_name` field on each TrieDetails is left unset inside a block —
  // the table is fixed by the enclosing TableBlock's path. See #5512.
  repeated xtdb.log.proto.TrieDetails tries = 4;
  int64 max_block_index = 5;
}

message TableBlock {
    bytes arrow_schema = 1;
    int64 row_count = 2;
    // deprecated, use partitions. See #4960
    repeated xtdb.log.proto.TrieDetails tries = 3;
    map<string, bytes> column_name_to_hll = 4;
    repeated Partition partitions = 5;
}

message TxKey {
    int64 tx_id = 1;
    int64 system_time = 2;
}

message TableEntry {
    uint32 oid = 1;
    string schema_name = 2;
    string table_name = 3;
    // The directory under `tables/` holding this table's files, frozen when the table is first
    // recorded — renaming the table does not move them. A table already on disk before this field
    // existed takes its escaped name, which is what keeps its existing files reachable. See #4037.
    string slug = 4;
}

message Block {
    int64 block_index = 1;
    TxKey latest_completed_tx = 2;
    int64 latest_processed_msg_id = 4;
    // Superseded by `tables`, and still written for readers that predate it. See #4037.
    repeated string table_names = 3;

    // present iff it's the cluster's primary ('xtdb') database
    map<string, xtdb.database.proto.DatabaseConfig> secondary_databases = 5;

    // the replica-log message ID of the BlockBoundary message for this block
    int64 boundary_replica_msg_id = 6;

    // opaque token tracking how far the leader consumed an external source (e.g. CDC offset)
    bytes external_source_token = 7;

    // the leader term that produced this block's boundary; followers seed their
    // read-side term fence from it. Default 0 for blocks written before this field. See #5817.
    int64 term_id = 8;

    repeated TableEntry tables = 9;
}