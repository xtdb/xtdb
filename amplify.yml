version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - npm ci
            # activate swap to avoid OOM https://github.com/aws-amplify/amplify-hosting/issues/654
            - export NODE_OPTIONS=--max-old-space-size=16384
            - dd if=/dev/zero of=swapfile bs=1K count=6M
            - chmod 600 swapfile
            - mkswap swapfile
            - swapon swapfile
            - swapon -s
        build:
          commands:
            - npm run build-api-docs
            - ../gradlew --stop
            - npm run build
      artifacts:
        baseDirectory: /dist
        files:
          - '**/*'
      cache:
        paths:
          - ~/.npm/**/*
          - ~/.m2/repository
          - ~/.gradle/caches
    appRoot: docs
