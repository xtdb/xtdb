name: Docker images

on:
  workflow_call:

jobs:
  build-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - name: Set up JDKs 25 and 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: |
            25
            21
          distribution: 'temurin'
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Standalone meta
        id: standalone-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/xtdb/xtdb
          tags: &tags |
            type=semver,pattern={{version}}
            type=schedule
            type=schedule,pattern=nightly-{{date 'YYYYMMDD'}}
            type=edge,branch=main
            type=sha,prefix=g
          bake-target: standalone

      - name: AWS meta
        id: aws-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/xtdb/xtdb-aws
          tags: *tags
          bake-target: aws

      - name: Azure meta
        id: azure-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/xtdb/xtdb-azure
          tags: *tags
          bake-target: azure

      - name: Google Cloud meta
        id: google-cloud-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/xtdb/xtdb-google-cloud
          tags: *tags
          bake-target: google-cloud

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build Uberjars
        run: ./gradlew :docker:standalone:shadowJar :docker:aws:shadowJar :docker:azure:shadowJar :docker:google-cloud:shadowJar

      - name: Build and push
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          # the uberjars are build output, so bake from the working tree rather than the Git context
          source: .
          files: |
            docker-bake.hcl
            ${{ steps.standalone-meta.outputs.bake-file-tags }}
            ${{ steps.standalone-meta.outputs.bake-file-labels }}
            ${{ steps.aws-meta.outputs.bake-file-tags }}
            ${{ steps.aws-meta.outputs.bake-file-labels }}
            ${{ steps.azure-meta.outputs.bake-file-tags }}
            ${{ steps.azure-meta.outputs.bake-file-labels }}
            ${{ steps.google-cloud-meta.outputs.bake-file-tags }}
            ${{ steps.google-cloud-meta.outputs.bake-file-labels }}
          targets: release
          push: ${{ github.event_name != 'pull_request' }}
          set: |
            *.args.GIT_SHA=${{ github.sha }}
            *.args.XTDB_VERSION=${{ steps.standalone-meta.outputs.version }}
